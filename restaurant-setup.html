  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================

    ========================= */

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       ELEMENTS
    ========================= */

    const categoriesEl =
      document.getElementById("categories");

    const messageEl =
      document.getElementById("message");

    const savedUrlBox =
      document.getElementById("savedUrlBox");

    const savedUrlEl =
      document.getElementById("savedUrl");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type = "error") {

      messageEl.textContent = text;

      messageEl.className =
        "message " + type;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function clearMessage() {

      messageEl.textContent = "";

      messageEl.className = "message";
    }


    /* =========================
       BACK
    ========================= */

    function goBack() {

      if (document.referrer) {
        history.back();
      } else {
        window.location.href = "index.html";
      }
    }


    /* =========================
       SLUG
    ========================= */

    function createMenuSlug(name) {

      let clean =
        String(name || "")
          .trim()
          .toLowerCase()
          .replace(/[^\u0600-\u06FFa-z0-9]+/gi, "-")
          .replace(/^-+|-+$/g, "");

      if (!clean) {
        clean = "menu";
      }

      const random =
        Math.random()
          .toString(36)
          .substring(2, 8);

      return clean + "-" + random;
    }


    /* =========================
       PUBLIC URL
    ========================= */

    function buildPublicMenuUrl(slug) {

      if (!slug) return "";

      const url =
        new URL(
          "menu.html",
          window.location.origin + "/"
        );

      url.searchParams.set(
        "slug",
        slug
      );

      return url.href;
    }


    /* =========================
       GET SAVED SLUG
    ========================= */

    function getSavedSlug() {

      let slug =
        localStorage.getItem(
          "warsha_restaurant_menu_slug"
        );

      if (slug) return slug;


      const savedUrl =
        localStorage.getItem(
          "warsha_restaurant_menu_url"
        );

      if (savedUrl) {

        try {

          const url =
            new URL(savedUrl);

          slug =
            url.searchParams.get("slug");

          if (slug) {

            localStorage.setItem(
              "warsha_restaurant_menu_slug",
              slug
            );

            return slug;
          }

        } catch (e) {}
      }

      return "";
    }


    /* =========================
       CATEGORIES
    ========================= */

    function addCategory(categoryData = null) {

      const category =
        document.createElement("div");

      category.className = "category";

      category.innerHTML = `

        <div class="category-head">

          <input
            class="category-name"
            type="text"
            placeholder="اسم القسم — مثال: سخن"
            value="${escapeHtml(
              categoryData?.name || ""
            )}"
          >

          <button
            class="btn btn-danger"
            type="button"
            onclick="this.closest('.category').remove()"
          >
            حذف القسم
          </button>

        </div>

        <div class="items"></div>

        <button
          class="btn btn-light"
          type="button"
          onclick="addItem(this)"
        >
          + إضافة صنف
        </button>

      `;

      categoriesEl.appendChild(category);


      const items =
        categoryData?.items || [];

      if (items.length) {

        items.forEach(item => {

          addItem(
            category.querySelector(
              ".btn-light"
            ),
            item
          );

        });

      } else {

        addItem(
          category.querySelector(
            ".btn-light"
          )
        );

      }
    }


    function addItem(button, itemData = null) {

      const category =
        button.closest(".category");

      const itemsEl =
        category.querySelector(".items");

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <div class="item-grid">

          <input
            class="item-name"
            type="text"
            placeholder="اسم الصنف"
            value="${escapeHtml(
              itemData?.name || ""
            )}"
          >

          <input
            class="item-price"
            type="number"
            min="0"
            step="0.01"
            placeholder="السعر"
            value="${itemData?.price ?? ""}"
          >

          <button
            class="btn btn-danger"
            type="button"
            onclick="this.closest('.item').remove()"
          >
            حذف
          </button>

        </div>

      `;

      itemsEl.appendChild(item);
    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       COLLECT MENU
    ========================= */

    function collectCategories() {

      const categories = [];

      document
        .querySelectorAll(".category")
        .forEach(category => {

          const name =
            category
              .querySelector(".category-name")
              .value
              .trim();

          const items = [];

          category
            .querySelectorAll(".item")
            .forEach(item => {

              const itemName =
                item
                  .querySelector(".item-name")
                  .value
                  .trim();

              const price =
                item
                  .querySelector(".item-price")
                  .value
                  .trim();

              if (itemName) {

                items.push({
                  name: itemName,
                  price: price
                });

              }

            });


          if (name) {

            categories.push({
              name: name,
              items: items
            });

          }

        });

      return categories;
    }


    /* =========================
       SAVE SITE
    ========================= */

    async function createRestaurantSite() {

      clearMessage();

      const saveBtn =
        document.getElementById("saveBtn");

      saveBtn.disabled = true;

      saveBtn.textContent =
        "⏳ جاري الحفظ...";


      try {

        /* ---------- USER ---------- */

        const {
          data: {
            user
          },
          error: userError
        } =
          await supabaseClient.auth.getUser();


        if (userError || !user) {

          throw new Error(
            "يجب تسجيل الدخول أولاً."
          );

        }


        /* ---------- FORM ---------- */

        const businessName =
          document
            .getElementById("businessName")
            .value
            .trim();

        const businessType =
          document
            .getElementById("businessType")
            .value;

        const phone =
          document
            .getElementById("phone")
            .value
            .trim();

        const address =
          document
            .getElementById("address")
            .value
            .trim();

        const workingHours =
          document
            .getElementById("workingHours")
            .value
            .trim();

        const description =
          document
            .getElementById("description")
            .value
            .trim();

        const categories =
          collectCategories();


        if (!businessName) {

          throw new Error(
            "اكتب اسم المطعم أو الكافيه."
          );

        }


        if (!categories.length) {

          throw new Error(
            "أضف قسمًا واحدًا على الأقل للمنيو."
          );

        }


        /* =========================
           EXISTING MENU
        ========================= */

        let savedMenuId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          ) || "";

        let savedSlug =
          getSavedSlug() || "";

        let existingMenu = null;


        /*
          1) البحث باستخدام ID المحفوظ
        */

        if (savedMenuId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, public_slug, menu_data"
              )
              .eq("id", savedMenuId)
              .eq("user_id", user.id)
              .maybeSingle();

          if (!result.error &&
              result.data) {

            existingMenu =
              result.data;

          }

        }


        /*
          2) لو مفيش ID:
             البحث باستخدام الـslug المحفوظ
        */

        if (!existingMenu && savedSlug) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, public_slug, menu_data"
              )
              .eq(
                "public_slug",
                savedSlug
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();

          if (!result.error &&
              result.data) {

            existingMenu =
              result.data;

            savedMenuId =
              result.data.id;

          }

        }


        /*
          3) لو مفيش ID ولا slug:
             نبحث عن آخر منيو لهذا المستخدم.

             ده فقط عند أول إنشاء،
             وليس أثناء التعديل.
        */

        if (!existingMenu &&
            !savedMenuId &&
            !savedSlug) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, public_slug, menu_data"
              )
              .eq(
                "user_id",
                user.id
              )
              .order(
                "updated_at",
                { ascending: false }
              )
              .limit(1)
              .maybeSingle();

          if (!result.error &&
              result.data) {

            /*
              نستخدم السجل السابق فقط
              لو كان مرتبطًا بالموقع الحالي.
            */

            const oldData =
              result.data.menu_data;

            if (
              oldData &&
              typeof oldData === "object" &&
              (
                oldData.businessName === businessName ||
                oldData.public_slug === result.data.public_slug
              )
            ) {

              existingMenu =
                result.data;

              savedMenuId =
                result.data.id;

              savedSlug =
                result.data.public_slug || "";

            }

          }

        }


        /* =========================
           STABLE SLUG
        ========================= */

        /*
          أهم جزء:

          لو عندنا slug قديم:
          نستخدمه كما هو.

          ممنوع إنشاء slug جديد
          أثناء التعديل.
        */

        if (existingMenu &&
            existingMenu.public_slug) {

          savedSlug =
            existingMenu.public_slug;

        }


        /*
          لو الـslug موجود في localStorage
          لكنه غير موجود في DB،
          نحافظ عليه أيضًا إذا كان لدينا ID.
        */

        if (!savedSlug &&
            existingMenu &&
            existingMenu.public_slug) {

          savedSlug =
            existingMenu.public_slug;

        }


        /*
          إنشاء slug جديد فقط
          عند إنشاء منيو جديدة تمامًا.
        */

        if (!savedSlug) {

          savedSlug =
            createMenuSlug(
              businessName
            );

        }


        const publicMenuUrl =
          buildPublicMenuUrl(
            savedSlug
          );


        /* =========================
           SITE DATA
        ========================= */

        const siteData = {

          businessName,
          businessType,
          phone,
          address,
          workingHours,
          description,

          categories,

          public_slug:
            savedSlug,

          public_menu_url:
            publicMenuUrl

        };


        /* =========================
           DATABASE DATA
        ========================= */

        const menuData = {

          businessName,
          businessType,
          phone,
          address,
          workingHours,
          description,

          categories,

          public_slug:
            savedSlug,

          public_menu_url:
            publicMenuUrl,

          updated_from:
            "restaurant-setup"

        };


        /* =========================
           UPDATE EXISTING
        ========================= */

        if (savedMenuId) {

          const updateResult =
            await supabaseClient
              .from("restaurant_menus")
              .update({

                menu_name:
                  businessName,

                business_type:
                  businessType,

                menu_data:
                  menuData,

                public_slug:
                  savedSlug,

                updated_at:
                  new Date().toISOString()

              })
              .eq(
                "id",
                savedMenuId
              )
              .eq(
                "user_id",
                user.id
              );


          /*
            مهم جدًا:

            لا نستخدم .select()
            هنا.

            لأن RLS ممكن يسمح بالتحديث
            لكنه يمنع رجوع الصف،
            وبالتالي الكود القديم كان
            يظن أن التحديث فشل.
          */

          if (updateResult.error) {

            throw new Error(
              "تعذر تحديث المنيو القديمة: " +
              updateResult.error.message
            );

          }

        }

        /* =========================
           INSERT NEW
        ========================= */

        else {

          const insertResult =
            await supabaseClient
              .from("restaurant_menus")
              .insert({

                user_id:
                  user.id,

                menu_name:
                  businessName,

                business_type:
                  businessType,

                menu_data:
                  menuData,

                public_slug:
                  savedSlug,

                updated_at:
                  new Date().toISOString()

              })
              .select(
                "id, public_slug"
              )
              .single();


          if (insertResult.error) {

            /*
              احتمال ضئيل أن الـslug
              موجود بالفعل.
            */

            if (
              String(
                insertResult.error.message
              ).toLowerCase()
              .includes("duplicate")
            ) {

              savedSlug =
                createMenuSlug(
                  businessName
                );

              const retryUrl =
                buildPublicMenuUrl(
                  savedSlug
                );

              menuData.public_slug =
                savedSlug;

              menuData.public_menu_url =
                retryUrl;

              siteData.public_slug =
                savedSlug;

              siteData.public_menu_url =
                retryUrl;


              const retry =
                await supabaseClient
                  .from("restaurant_menus")
                  .insert({

                    user_id:
                      user.id,

                    menu_name:
                      businessName,

                    business_type:
                      businessType,

                    menu_data:
                      menuData,

                    public_slug:
                      savedSlug,

                    updated_at:
                      new Date().toISOString()

                  })
                  .select(
                    "id, public_slug"
                  )
                  .single();


              if (retry.error) {

                throw new Error(
                  retry.error.message
                );

              }

              savedMenuId =
                retry.data.id;

            } else {

              throw new Error(
                insertResult.error.message
              );

            }

          } else {

            savedMenuId =
              insertResult.data.id;

            savedSlug =
              insertResult.data.public_slug ||
              savedSlug;

          }

        }


        /* =========================
           FINAL URL
        ========================= */

        const finalUrl =
          buildPublicMenuUrl(
            savedSlug
          );


        /* =========================
           LOCAL STORAGE
        ========================= */

        siteData.public_slug =
          savedSlug;

        siteData.public_menu_url =
          finalUrl;


        localStorage.setItem(
          "warsha_restaurant_site",
          JSON.stringify(siteData)
        );

        localStorage.setItem(
          "warsha_restaurant_menu_id",
          String(savedMenuId)
        );

        localStorage.setItem(
          "warsha_restaurant_menu_slug",
          savedSlug
        );

        localStorage.setItem(
          "warsha_restaurant_menu_url",
          finalUrl
        );


        /* =========================
           SHOW URL
        ========================= */

        savedUrlEl.href =
          finalUrl;

        savedUrlEl.textContent =
          finalUrl;

        savedUrlBox.style.display =
          "block";


        showMessage(
          "✅ تم حفظ الموقع بنجاح. رابط المنيو والباركود سيظلان ثابتين عند التعديل.",
          "success"
        );


        /*
          ننتظر قليلًا حتى يظهر
          نجاح الحفظ ثم نذهب للمعاينة.
        */

        setTimeout(() => {

          window.location.href =
            "restaurant-preview.html";

        }, 800);


      } catch (error) {

        console.error(
          "SAVE ERROR:",
          error
        );

        showMessage(
          error.message ||
          "حدث خطأ أثناء حفظ الموقع."
        );

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          "💾 حفظ الموقع";

      }

    }


    /* =========================
       LOAD SAVED DATA
    ========================= */

    function loadSavedData() {

      let raw =
        localStorage.getItem(
          "warsha_restaurant_site"
        );

      if (!raw) {

        /*
          منيو جديدة
        */

        addCategory({
          name: "سخن",
          items: [
            {
              name: "شاي",
              price: "9"
            }
          ]
        });

        return;
      }


      try {

        const data =
          JSON.parse(raw);


        document
          .getElementById("businessName")
          .value =
          data.businessName || "";


        document
          .getElementById("businessType")
          .value =
          data.businessType || "مطعم";


        document
          .getElementById("phone")
          .value =
          data.phone || "";


        document
          .getElementById("address")
          .value =
          data.address || "";


        document
          .getElementById("workingHours")
          .value =
          data.workingHours || "";


        document
          .getElementById("description")
          .value =
          data.description || "";


        /*
          استرجاع الرابط والـslug
        */

        if (data.public_slug) {

          localStorage.setItem(
            "warsha_restaurant_menu_slug",
            data.public_slug
          );

        }


        if (data.public_menu_url) {

          localStorage.setItem(
            "warsha_restaurant_menu_url",
            data.public_menu_url
          );

        }


        const categories =
          data.categories || [];


        categoriesEl.innerHTML =
          "";


        if (categories.length) {

          categories.forEach(
            category => addCategory(category)
          );

        } else {

          addCategory();

        }


        /*
          إظهار الرابط الموجود
        */

        const slug =
          data.public_slug ||
          getSavedSlug();


        if (slug) {

          const url =
            buildPublicMenuUrl(slug);

          savedUrlEl.href =
            url;

          savedUrlEl.textContent =
            url;

          savedUrlBox.style.display =
            "block";

        }

      } catch (error) {

        console.error(
          "LOAD ERROR:",
          error
        );

        addCategory();

      }

    }


    /* =========================
       START
    ========================= */

    async function init() {

      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();


        if (!session) {

          showMessage(
            "يجب تسجيل الدخول أولاً."
          );

          setTimeout(() => {

            window.location.href =
              "login.html";

          }, 1200);

          return;

        }


        loadSavedData();

      } catch (error) {

        console.error(error);

        showMessage(
          "تعذر التحقق من تسجيل الدخول."
        );

      }

    }


    init();

  </script>
