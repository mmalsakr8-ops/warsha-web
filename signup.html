  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    // توحيد رقم الهاتف المصري
    function normalizeEgyptianPhone(phone) {
      let value = phone.trim();

      // تحويل الأرقام العربية إلى إنجليزية
      value = value.replace(/[٠-٩]/g, function(digit) {
        return "٠١٢٣٤٥٦٧٨٩".indexOf(digit);
      });

      // إزالة المسافات والرموز
      value = value.replace(/\s+/g, "");
      value = value.replace(/-/g, "");

      // تحويل +20XXXXXXXXXX إلى 01XXXXXXXXX
      if (value.startsWith("+20")) {
        value = "0" + value.substring(3);
      }

      // تحويل 20XXXXXXXXXX إلى 01XXXXXXXXX
      if (value.startsWith("20") && value.length === 12) {
        value = "0" + value.substring(2);
      }

      return value;
    }

    // التحقق من رقم الهاتف المصري
    function isValidEgyptianPhone(phone) {
      return /^01[0125][0-9]{8}$/.test(phone);
    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "message";

      const fullName = document.getElementById("fullName").value.trim();

      let phone = document.getElementById("phone").value.trim();

      const email = document.getElementById("email").value.trim().toLowerCase();

      const password = document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      // توحيد الرقم
      phone = normalizeEgyptianPhone(phone);

      // التحقق من الاسم
      if (fullName.length < 2) {
        showMessage("من فضلك اكتب اسمك بالكامل.", "error");
        return;
      }

      // التحقق من رقم الهاتف
      if (!isValidEgyptianPhone(phone)) {
        showMessage(
          "رقم الهاتف غير صحيح. من فضلك أدخل رقم موبايل مصري صحيح مثل 01012345678.",
          "error"
        );
        return;
      }

      // التحقق من كلمة المرور
      if (password !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
          "error"
        );
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "جاري التحقق...";

      try {

        // فحص رقم الهاتف قبل إنشاء الحساب
        const { data: existingProfile, error: phoneCheckError } =
          await supabaseClient
            .from("profiles")
            .select("id")
            .eq("phone", phone)
            .maybeSingle();

        if (phoneCheckError) {
          console.error(phoneCheckError);

          showMessage(
            "حدث خطأ أثناء التحقق من رقم الهاتف. حاول مرة أخرى.",
            "error"
          );

          return;
        }

        if (existingProfile) {
          showMessage(
            "رقم الهاتف ده مستخدم بالفعل في حساب آخر. استخدم رقمًا مختلفًا.",
            "error"
          );

          return;
        }

        signupBtn.textContent = "جاري إنشاء الحساب...";

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName,
                phone: phone
              }
            }
          });

        if (error) {

          console.error(error);

          const errorMessage = error.message.toLowerCase();

          if (
            errorMessage.includes("user already registered") ||
            errorMessage.includes("already registered")
          ) {
            showMessage(
              "البريد الإلكتروني ده مستخدم بالفعل. جرّب تسجيل الدخول.",
              "error"
            );

          } else if (
            errorMessage.includes("rate limit") ||
            errorMessage.includes("email rate limit")
          ) {
            showMessage(
              "تم تجاوز حد إرسال رسائل التأكيد مؤقتًا. حاول مرة أخرى لاحقًا.",
              "error"
            );

          } else {
            showMessage(
              "تعذر إنشاء الحساب حاليًا. حاول مرة أخرى.",
              "error"
            );
          }

          return;
        }

        showMessage(
          "تم إنشاء الحساب بنجاح. من فضلك راجع بريدك الإلكتروني لتأكيد الحساب.",
          "success"
        );

        form.reset();

      } catch (error) {

        console.error(error);

        showMessage(
          "حدث خطأ غير متوقع. حاول مرة أخرى.",
          "error"
        );

      } finally {

        signupBtn.disabled = false;
        signupBtn.textContent = "إنشاء الحساب";

      }

    });

  </script>
