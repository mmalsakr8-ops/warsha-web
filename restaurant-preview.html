  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f4f5f7;

    .topbar {

<body>

  <div class="topbar">
    👀 أنت الآن تشاهد معاينة موقعك
  </div>

  <div class="preview-bar">

    <div class="preview-title">
      🛠️ ورشة ويب — معاينة الموقع
    </div>

    <div class="preview-actions">
      <button class="back-btn" onclick="goBack()">
        ← رجوع
      </button>

      <button class="edit-btn" onclick="editSite()">
        ✏️ تعديل الموقع
      </button>
    </div>

  </div>

  <main id="site" class="site"></main>

  <footer>
    تم إنشاء الموقع بواسطة <strong>ورشة ويب</strong>
  </footer>

  <script>

    let siteData = null;

    function loadSite() {

      const saved =
        localStorage.getItem("warsha_restaurant_site");

      if (!saved) {
        showEmpty();
        return;
      }

      try {
        siteData = JSON.parse(saved);
        renderSite();
      } catch (error) {
        showEmpty();
      }
    }

    function renderSite() {

      const site =
        document.getElementById("site");

      const design =
        siteData.design || "modern";

      const businessName =
        escapeHTML(siteData.business_name || "مطعمي");

      const description =
        escapeHTML(
          siteData.description ||
          "أهلاً بكم، نتمنى لكم تجربة رائعة."
        );

      const phone =
        escapeHTML(siteData.phone || "غير مضاف");

      const address =
        escapeHTML(siteData.address || "غير مضاف");

      const hours =
        escapeHTML(
          siteData.working_hours ||
          "غير مضافة"
        );

      const category =
        escapeHTML(
          siteData.menu_category ||
          "المنيو"
        );

      const items =
        Array.isArray(siteData.menu_items)
          ? siteData.menu_items
          : [];

      let menuHTML = "";

      items.forEach(item => {

        const name =
          escapeHTML(item.name || "صنف");

        const price =
          escapeHTML(item.price || "");

        menuHTML += `
          <div class="menu-item">

            <div class="item-name">
              ${name}
            </div>

            <div class="item-price">
              ${price ? price + " جنيه" : ""}
            </div>

          </div>
        `;
      });

      site.innerHTML = `

        <section class="hero ${design}">

          <h1>
            ${businessName}
          </h1>

          <p>
            ${description}
          </p>

          <div class="info">

            <span>
              🍽️ ${getBusinessType(siteData.business_type)}
            </span>

            <span>
              🕐 ${hours}
            </span>

          </div>

        </section>

        <div class="content">

          <section class="section">

            <h2>
              📋 ${category}
            </h2>

            ${menuHTML}

          </section>

          <section class="section">

            <h2>
              📍 تواصل معنا
            </h2>

            <div class="contact-grid">

              <div class="contact-box">

                <div class="contact-icon">
                  📞
                </div>

                <strong>
                  الهاتف
                </strong>

                <div>
                  ${phone}
                </div>

              </div>

              <div class="contact-box">

                <div class="contact-icon">
                  📍
                </div>

                <strong>
                  العنوان
                </strong>

                <div>
                  ${address}
                </div>

              </div>

              <div class="contact-box">

                <div class="contact-icon">
                  🕐
                </div>

                <strong>
                  مواعيد العمل
                </strong>

                <div>
                  ${hours}
                </div>

              </div>

            </div>

          </section>

          <div class="actions">

            ${
              siteData.phone
              ? `
                <button
                  class="main-action"
                  onclick="callBusiness()"
                >
                  📞 اتصل بنا
                </button>
              `
              : ""
            }

            ${
              siteData.whatsapp
              ? `
                <button
                  class="secondary-action"
                  onclick="openWhatsApp()"
                >
                  💬 واتساب
                </button>
              `
              : ""
            }

          </div>

        </div>
      `;
    }

    function getBusinessType(type) {

      const types = {
        restaurant: "مطعم",
        cafe: "كافيه",
        "restaurant-cafe": "مطعم وكافيه",
        bakery: "مخبوزات وحلويات",
        other: "نشاط تجاري"
      };

      return types[type] || "مطعم";
    }

    function callBusiness() {

      if (!siteData || !siteData.phone) {
        return;
      }

      window.location.href =
        "tel:" + siteData.phone;
    }

    function openWhatsApp() {

      if (!siteData || !siteData.whatsapp) {
        return;
      }

      let number =
        siteData.whatsapp
          .replace(/\D/g, "");

      if (number.startsWith("0")) {
        number =
          "20" + number.substring(1);
      }

      if (!number.startsWith("20")) {
        number = "20" + number;
      }

      window.open(
        "https://wa.me/" + number,
        "_blank"
      );
    }

    function editSite() {
      window.location.href =
        "restaurant-setup.html";
    }

    function goBack() {
      window.location.href =
        "create-site.html";
    }

    function showEmpty() {

      document.getElementById("site").innerHTML = `

        <div class="empty">

          <h2>
            مفيش موقع محفوظ لسه
          </h2>

          <p>
            ابدأ بإدخال بيانات المطعم والمنيو.
          </p>

          <button onclick="editSite()">
            🍽️ ابدأ إنشاء الموقع
          </button>

        </div>

      `;
    }

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadSite();

  </script>

</body>
</html>
