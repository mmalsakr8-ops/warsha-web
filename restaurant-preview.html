  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let siteData = null;
    let publicMenuUrl = "";


    /* =========================
       PUBLIC URL
    ========================= */

    function buildPublicMenuUrl(slug) {

      if (!slug) return "";

      const url =
        new URL(
          "menu.html",
          window.location.origin + "/"
        );

      url.searchParams.set(
        "slug",
        slug
      );

      return url.href;
    }


    /* =========================
       ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       LOAD LOCAL DATA FIRST
    ========================= */

    function loadLocalData() {

      try {

        const raw =
          localStorage.getItem(
            "warsha_restaurant_site"
          );

        if (raw) {

          siteData =
            JSON.parse(raw);

        }

      } catch (error) {

        console.error(error);

      }


      /*
        أهم جزء:

        ناخد الـslug من localStorage
        قبل ما نستنى Supabase.
      */

      let slug =
        localStorage.getItem(
          "warsha_restaurant_menu_slug"
        ) || "";


      /*
        لو مفيش slug نحاول نطلعه
        من الرابط القديم.
      */

      if (!slug) {

        const savedUrl =
          localStorage.getItem(
            "warsha_restaurant_menu_url"
          );

        if (savedUrl) {

          try {

            const url =
              new URL(savedUrl);

            slug =
              url.searchParams.get(
                "slug"
              ) || "";

          } catch (e) {}

        }

      }


      /*
        لو siteData فيه slug
      */

      if (!slug &&
          siteData &&
          siteData.public_slug) {

        slug =
          siteData.public_slug;

      }


      if (slug) {

        publicMenuUrl =
          buildPublicMenuUrl(slug);

        /*
          حفظه مرة أخرى للتأكد
        */

        localStorage.setItem(
          "warsha_restaurant_menu_slug",
          slug
        );

        localStorage.setItem(
          "warsha_restaurant_menu_url",
          publicMenuUrl
        );

      }


      return !!siteData;

    }


    /* =========================
       LOAD FROM SUPABASE
    ========================= */

    async function refreshFromDatabase() {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) return;


        const savedId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          );


        const savedSlug =
          localStorage.getItem(
            "warsha_restaurant_menu_slug"
          );


        let menu = null;


        /*
          البحث بالـID أولاً
        */

        if (savedId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug"
              )
              .eq(
                "id",
                savedId
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (!result.error &&
              result.data) {

            menu =
              result.data;

          }

        }


        /*
          البحث بالـslug ثانيًا
        */

        if (!menu && savedSlug) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug"
              )
              .eq(
                "public_slug",
                savedSlug
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (!result.error &&
              result.data) {

            menu =
              result.data;

          }

        }


        if (!menu) return;


        /*
          تحديث ID
        */

        localStorage.setItem(
          "warsha_restaurant_menu_id",
          String(menu.id)
        );


        /*
          الحفاظ على الـslug
        */

        if (menu.public_slug) {

          publicMenuUrl =
            buildPublicMenuUrl(
              menu.public_slug
            );

          localStorage.setItem(
            "warsha_restaurant_menu_slug",
            menu.public_slug
          );

          localStorage.setItem(
            "warsha_restaurant_menu_url",
            publicMenuUrl
          );

        }


        /*
          لو menu_data موجود،
          نستخدمه لتحديث الموقع.
        */

        if (
          menu.menu_data &&
          typeof menu.menu_data === "object"
        ) {

          siteData =
            menu.menu_data;

          siteData.public_slug =
            menu.public_slug ||
            siteData.public_slug ||
            "";

          siteData.public_menu_url =
            publicMenuUrl;

          localStorage.setItem(
            "warsha_restaurant_site",
            JSON.stringify(siteData)
          );

        }


      } catch (error) {

        /*
          لا نوقف الصفحة.

          لو Supabase فشل،
          نستخدم البيانات المحلية.
        */

        console.error(
          "DATABASE REFRESH ERROR:",
          error
        );

      }

    }


    /* =========================
       RENDER
    ========================= */

    function renderSite() {

      const container =
        document.getElementById(
          "siteContainer"
        );

      if (!siteData) {

        container.innerHTML = `
          <div class="error">
            لم يتم العثور على بيانات الموقع.
            <br><br>
            ارجع إلى صفحة الإعداد وأنشئ الموقع مرة أخرى.
          </div>
        `;

        return;

      }


      const categories =
        siteData.categories || [];


      const phone =
        siteData.phone || "";


      const phoneHref =
        phone
          ? "tel:" +
            phone.replace(/\s/g, "")
          : "#";


      let categoriesHtml = "";


      categories.forEach(category => {

        const items =
          category.items || [];


        let itemsHtml = "";


        items.forEach(item => {

          itemsHtml += `

            <div class="item">

              <div class="item-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="item-price">
                ${escapeHtml(item.price)}
                جنيه
              </div>

            </div>

          `;

        });


        categoriesHtml += `

          <section class="category">

            <h4 class="category-title">
              ${escapeHtml(category.name)}
            </h4>

            ${itemsHtml}

          </section>

        `;

      });


      let qrSection = "";


      /*
        لو الرابط موجود:
        نظهر QR والرابط دائمًا.
      */

      if (publicMenuUrl) {

        qrSection = `

          <section class="qr-section">

            <h3>
              📱 باركود المنيو
            </h3>

            <p class="qr-description">
              امسح الباركود بالموبايل لفتح المنيو مباشرة
            </p>

            <div class="qr-box">

              <div id="qrcode"></div>

            </div>

            <div class="public-url-box">

              <div class="public-url-label">
                🔗 رابط المنيو العام
              </div>

              <a
                id="publicUrl"
                class="public-url"
                href="${escapeHtml(publicMenuUrl)}"
                target="_blank"
              >
                ${escapeHtml(publicMenuUrl)}
              </a>

              <div class="qr-actions">

                <button
                  class="btn copy-btn"
                  onclick="copyPublicUrl()"
                >
                  📋 نسخ الرابط
                </button>

                <a
                  class="btn open-btn"
                  href="${escapeHtml(publicMenuUrl)}"
                  target="_blank"
                >
                  🔗 فتح المنيو
                </a>

              </div>

              <div class="stable-note">
                🔒 هذا الرابط والباركود ثابتان حتى بعد تعديل المنيو.
              </div>

            </div>

          </section>

        `;

      } else {

        /*
          في حالة عدم وجود slug،
          نظهر رسالة واضحة بدل اختفاء القسم.
        */

        qrSection = `

          <section class="qr-section">

            <h3>
              📱 باركود المنيو
            </h3>

            <p style="color:#b91c1c;font-weight:700;">
              لم يتم إنشاء رابط المنيو العام حتى الآن.
            </p>

            <div style="margin-top:15px;">
              اضغط "تعديل الموقع" ثم اضغط "حفظ الموقع" مرة أخرى.
            </div>

          </section>

        `;

      }


      container.innerHTML = `

        <div class="site">

          <section class="hero">

            <h2>
              ${escapeHtml(
                siteData.businessName ||
                "اسم المطعم"
              )}
            </h2>

            <p>
              ${escapeHtml(
                siteData.description ||
                ""
              )}
            </p>

            ${
              phone
              ? `
                <a
                  class="hero-phone"
                  href="${escapeHtml(phoneHref)}"
                >
                  📞 ${escapeHtml(phone)}
                </a>
              `
              : ""
            }

          </section>


          <div class="info-row">

            <div class="info-pill">
              🍽️ ${escapeHtml(
                siteData.businessType || ""
              )}
            </div>

            ${
              siteData.workingHours
              ? `
                <div class="info-pill">
                  🕐 ${escapeHtml(
                    siteData.workingHours
                  )}
                </div>
              `
              : ""
            }

          </div>


          <section class="menu-area">

            <div class="menu-title">

              <h3>
                🍽️ المنيو
              </h3>

            </div>

            ${categoriesHtml}

          </section>


          <section class="contact">

            <h3>
              📍 تواصل معنا
            </h3>

            <div class="contact-grid">

              ${
                phone
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      📞
                    </div>

                    <strong>
                      الهاتف
                    </strong>

                    <a href="${escapeHtml(phoneHref)}">
                      ${escapeHtml(phone)}
                    </a>

                  </div>
                `
                : ""
              }


              ${
                siteData.address
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      📍
                    </div>

                    <strong>
                      العنوان
                    </strong>

                    <div>
                      ${escapeHtml(
                        siteData.address
                      )}
                    </div>

                  </div>
                `
                : ""
              }


              ${
                siteData.workingHours
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      🕐
                    </div>

                    <strong>
                      مواعيد العمل
                    </strong>

                    <div>
                      ${escapeHtml(
                        siteData.workingHours
                      )}
                    </div>

                  </div>
                `
                : ""
              }

            </div>


            <div class="buttons">

              ${
                phone
                ? `
                  <a
                    class="btn action-call"
                    href="${escapeHtml(phoneHref)}"
                  >
                    📞 اتصل بنا
                  </a>
                `
                : ""
              }


              ${
                phone
                ? `
                  <a
                    class="btn action-whatsapp"
                    href="https://wa.me/${phone.replace(/\D/g, "")}"
                    target="_blank"
                  >
                    💬 واتساب
                  </a>
                `
                : ""
              }

            </div>

          </section>


          ${qrSection}

        </div>

      `;


      /*
        إنشاء QR بعد وضع HTML
      */

      createQRCode();

    }


    /* =========================
       CREATE QR
    ========================= */

    function createQRCode() {

      const qrElement =
        document.getElementById(
          "qrcode"
        );


      if (!qrElement) return;


      qrElement.innerHTML = "";


      if (!publicMenuUrl) return;


      /*
        نتأكد أن مكتبة QRCode موجودة
      */

      if (
        typeof QRCode ===
        "undefined"
      ) {

        qrElement.innerHTML = `

          <div style="
            color:#b91c1c;
            font-size:13px;
            font-weight:700;
            text-align:center;
          ">
            تعذر تحميل الباركود.
            <br>
            استخدم رابط المنيو الموجود أسفل الباركود.
          </div>

        `;

        return;

      }


      try {

        new QRCode(
          qrElement,
          {
            text: publicMenuUrl,
            width: 190,
            height: 190,
            correctLevel:
              QRCode.CorrectLevel.H
          }
        );

      } catch (error) {

        console.error(
          "QR ERROR:",
          error
        );

        qrElement.innerHTML = `
          <div style="
            color:#b91c1c;
            font-weight:700;
            font-size:13px;
          ">
            حدث خطأ في إنشاء الباركود.
          </div>
        `;

      }

    }


    /* =========================
       COPY URL
    ========================= */

    async function copyPublicUrl() {

      if (!publicMenuUrl) return;


      try {

        await navigator.clipboard.writeText(
          publicMenuUrl
        );

        alert(
          "✅ تم نسخ رابط المنيو"
        );

      } catch (error) {

        /*
          طريقة بديلة للآيفون
        */

        const input =
          document.createElement(
            "input"
          );

        input.value =
          publicMenuUrl;

        document.body.appendChild(
          input
        );

        input.select();

        document.execCommand(
          "copy"
        );

        input.remove();

        alert(
          "✅ تم نسخ رابط المنيو"
        );

      }

    }

    function goBack() {

      window.location.href =

    /* =========================
       INIT
    ========================= */

    async function init() {

      /*
        أولًا نقرأ localStorage
        ونظهر الموقع والرابط فورًا.
      */

      const hasLocal =
        loadLocalData();


      if (hasLocal) {

        renderSite();

        document
          .getElementById("loading")
          .style.display = "none";

      }


      /*
        بعد ذلك نتحقق من Supabase
        في الخلفية.
      */

      await refreshFromDatabase();


      /*
        نعيد الرسم بعد تحديث البيانات
      */

      if (siteData) {

        renderSite();

        document
          .getElementById("loading")
          .style.display = "none";

      } else {

        document
          .getElementById("loading")
          .style.display = "none";

        renderSite();

      }

    }


    init();

  </script>
