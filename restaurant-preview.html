  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let siteData = null;
    let publicMenuUrl = "";
    let publicSlug = "";
    let publicMenuId = "";


    /* =========================================
       تحميل الموقع
    ========================================= */

    async function loadSite() {

      const saved =
        localStorage.getItem(
          "warsha_restaurant_site"
        );

      if (!saved) {
        showEmpty();
        return;
      }

      try {

        siteData = JSON.parse(saved);

        /*
          نحاول أخذ الـ slug من كل الأماكن الممكنة
        */

        publicSlug =
          localStorage.getItem(
            "warsha_restaurant_menu_slug"
          ) ||
          siteData.public_slug ||
          getSlugFromSavedUrl(
            localStorage.getItem(
              "warsha_restaurant_menu_url"
            )
          ) ||
          "";

        publicMenuId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          ) ||
          "";

        /*
          أول محاولة:
          البحث في Supabase
        */

        await loadPublicMenu();

        /*
          لو لم نجد الرابط من Supabase
          نستخدم الـ slug المحفوظ
        */

        if (!publicMenuUrl && publicSlug) {

          buildPublicUrl(publicSlug);

        }

        /*
          لو مفيش slug لكن فيه رابط قديم
        */

        if (!publicMenuUrl) {

          const oldUrl =
            localStorage.getItem(
              "warsha_restaurant_menu_url"
            );

          if (oldUrl) {
            publicMenuUrl = oldUrl;
          }

        }

        renderSite();

      } catch (error) {

        console.error(
          "Load site error:",
          error
        );

        showEmpty();

      }

    }


    /* =========================================
       تحميل المنيو من Supabase
    ========================================= */

    async function loadPublicMenu() {

      try {

        let data = null;


        /*
          1 — البحث بالـ ID
        */

        if (publicMenuId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select("id, public_slug")
              .eq("id", publicMenuId)
              .maybeSingle();

          if (result.error) {
            console.error(
              "ID search error:",
              result.error
            );
          }

          if (result.data) {
            data = result.data;
          }

        }


        /*
          2 — لو لم نجد ID نبحث بالـ slug
        */

        if (!data && publicSlug) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select("id, public_slug")
              .eq("public_slug", publicSlug)
              .maybeSingle();

          if (result.error) {
            console.error(
              "Slug search error:",
              result.error
            );
          }

          if (result.data) {
            data = result.data;
          }

        }


        /*
          3 — لو وجدنا السجل
        */

        if (data && data.public_slug) {

          publicMenuId =
            data.id;

          publicSlug =
            data.public_slug;

          buildPublicUrl(
            publicSlug
          );

          localStorage.setItem(
            "warsha_restaurant_menu_id",
            String(publicMenuId)
          );

          localStorage.setItem(
            "warsha_restaurant_menu_slug",
            publicSlug
          );

          return;

        }


        /*
          4 — لو مفيش سجل في Supabase
             لكن عندنا slug محفوظ
        */

        if (publicSlug) {

          buildPublicUrl(
            publicSlug
          );

        }

      } catch (error) {

        console.error(
          "Public menu error:",
          error
        );

      }

    }


    /* =========================================
       بناء رابط المنيو
    ========================================= */

    function buildPublicUrl(slug) {

      if (!slug) {
        return;
      }

      /*
        استخدام نفس الدومين الحالي
        والرابط ثابت طالما الـ slug ثابت
      */

      const url =
        new URL(
          "menu.html",
          window.location.href
        );

      url.searchParams.set(
        "slug",
        slug
      );

      publicMenuUrl =
        url.href;

      /*
        إزالة أي / زائد قبل menu.html
        بشكل آمن
      */

      localStorage.setItem(
        "warsha_restaurant_menu_url",
        publicMenuUrl
      );

    }


    /* =========================================
       استخراج slug من رابط قديم
    ========================================= */

    function getSlugFromSavedUrl(url) {

      if (!url) {
        return "";
      }

      try {

        const parsed =
          new URL(url);

        return (
          parsed.searchParams.get(
            "slug"
          ) || ""
        );

      } catch (error) {

        return "";

      }

    }


    /* =========================================
       بناء الموقع
    ========================================= */

    function renderSite() {

      const site =
        document.getElementById("site");

      const businessName =
        escapeHTML(
          siteData.business_name ||
          "مطعمي"
        );

      const description =
        escapeHTML(
          siteData.description ||
          "أهلاً بكم، نتمنى لكم تجربة رائعة."
        );

      const phone =
        escapeHTML(
          siteData.phone ||
          "غير مضاف"
        );

      const address =
        escapeHTML(
          siteData.address ||
          "غير مضاف"
        );

      const hours =
        escapeHTML(
          siteData.working_hours ||
          "غير مضافة"
        );

      const design =
        siteData.design ||
        "modern";


      let categoriesHTML = "";


      if (
        Array.isArray(siteData.categories) &&
        siteData.categories.length
      ) {

        siteData.categories.forEach(
          category => {

            const categoryName =
              escapeHTML(
                category.name ||
                "قسم المنيو"
              );

            let itemsHTML = "";


            if (
              Array.isArray(category.items)
            ) {

              category.items.forEach(
                item => {

                  const itemName =
                    escapeHTML(
                      item.name ||
                      "صنف"
                    );

                  const itemPrice =
                    escapeHTML(
                      item.price ||
                      ""
                    );


                  itemsHTML += `

                    <div class="menu-item">

                      <div class="item-name">
                        ${itemName}
                      </div>

                      <div class="item-price">
                        ${
                          itemPrice
                            ? itemPrice + " جنيه"
                            : ""
                        }
                      </div>

                    </div>

                  `;

                }
              );

            }


            categoriesHTML += `

              <section class="menu-category">

                <h2 class="category-title">
                  ${categoryName}
                </h2>

                ${
                  itemsHTML ||
                  `
                    <p>
                      لا توجد أصناف مضافة لهذا القسم.
                    </p>
                  `
                }

              </section>

            `;

          }
        );

      }


      /*
        صندوق الرابط والـQR
        سيظهر بمجرد وجود slug
      */

      const publicMenuHTML =
        publicMenuUrl
          ? `

            <section class="public-menu-box">

              <h2>
                📱 منيو العملاء
              </h2>

              <div class="subtitle">
                ده رابط المنيو العامة الخاصة بعملائك.
                تقدر تبعته لهم أو تستخدم الـ QR Code.
              </div>

              <div class="qr-wrapper">

                <div id="qrcode">

                  <div class="qr-loading">
                    جاري إنشاء الباركود...
                  </div>

                </div>

              </div>

              <div class="public-url-title">
                🔗 رابط المنيو
              </div>

              <div class="public-url">
                ${escapeHTML(publicMenuUrl)}
              </div>

              <div class="public-actions">

                <button
                  class="open-menu-btn"
                  onclick="openPublicMenu()"
                >
                  🌐 فتح المنيو
                </button>

                <button
                  class="copy-menu-btn"
                  onclick="copyMenuUrl()"
                >
                  📋 نسخ الرابط
                </button>

                <button
                  class="share-menu-btn"
                  onclick="shareMenu()"
                >
                  📤 مشاركة
                </button>

              </div>

              <p class="qr-note">
                💡 الـ QR ده مرتبط برابط المنيو.
                تعديل الأسعار أو الأصناف لن يغيّر الباركود طالما المنيو نفسها محفوظة.
              </p>

            </section>

          `
          : `

            <section class="public-menu-box">

              <h2>
                ⚠️ رابط المنيو
              </h2>

              <div class="subtitle">
                لم يتم العثور على رابط المنيو المحفوظ.
              </div>

              <div class="error-box">
                اضغط "تعديل الموقع" ثم احفظ المنيو مرة أخرى.
                سيتم إنشاء رابط ثابت للمنيو، وبعدها سيظهر الـ QR هنا.
              </div>

            </section>

          `;


      site.innerHTML = `

        <section class="hero ${design}">

          <h1>
            ${businessName}
          </h1>

          <p>
            ${description}
          </p>

          <div class="hero-info">

            <span>
              🍽️ ${getBusinessType(
                siteData.business_type
              )}
            </span>

            <span>
              🕐 ${hours}
            </span>

          </div>

        </section>


        <div class="content">

          ${publicMenuHTML}


          ${categoriesHTML}


          <section class="contact-section">

            <h2>
              📍 تواصل معنا
            </h2>

            <div class="contact-grid">

              <div class="contact-box">

                <div class="contact-icon">
                  📞
                </div>

                <strong>
                  الهاتف
                </strong>

                <div>
                  ${phone}
                </div>

              </div>


              <div class="contact-box">

                <div class="contact-icon">
                  📍
                </div>

                <strong>
                  العنوان
                </strong>

                <div>
                  ${address}
                </div>

              </div>


              <div class="contact-box">

                <div class="contact-icon">
                  🕐
                </div>

                <strong>
                  مواعيد العمل
                </strong>

                <div>
                  ${hours}
                </div>

              </div>

            </div>

          </section>


          <div class="actions">

            ${
              siteData.phone
                ? `
                  <button
                    class="call-btn"
                    onclick="callBusiness()"
                  >
                    📞 اتصل بنا
                  </button>
                `
                : ""
            }


            ${
              siteData.whatsapp
                ? `
                  <button
                    class="whatsapp-btn"
                    onclick="openWhatsApp()"
                  >
                    💬 تواصل واتساب
                  </button>
                `
                : ""
            }

          </div>

        </div>

      `;


      /*
        إنشاء QR بعد رسم الصفحة
      */

      if (publicMenuUrl) {

        setTimeout(
          createQRCode,
          150
        );

      }

    }


    /* =========================================
       إنشاء QR
    ========================================= */

    function createQRCode() {

      const qrElement =
        document.getElementById(
          "qrcode"
        );

      if (
        !qrElement ||
        !publicMenuUrl
      ) {
        return;
      }


      qrElement.innerHTML = "";


      /*
        التأكد أن مكتبة QR موجودة
      */

      if (
        typeof QRCode === "undefined"
      ) {

        qrElement.innerHTML = `

          <div class="qr-loading">
            ⚠️ تعذر تحميل مكتبة الباركود.
            <br>
            أعد تحميل الصفحة.
          </div>

        `;

        return;

      }


      try {

        new QRCode(
          qrElement,
          {
            text: publicMenuUrl,
            width: 190,
            height: 190,
            correctLevel:
              QRCode.CorrectLevel.H
          }
        );

      } catch (error) {

        console.error(
          "QR Error:",
          error
        );

        qrElement.innerHTML = `

          <div class="qr-loading">
            ⚠️ حصل خطأ أثناء إنشاء الـ QR.
          </div>

        `;

      }

    }


    /* =========================================
       فتح المنيو
    ========================================= */

    function openPublicMenu() {

      if (!publicMenuUrl) {

        alert(
          "⚠️ رابط المنيو غير موجود."
        );

        return;

      }

      window.open(
        publicMenuUrl,
        "_blank"
      );

    }


    /* =========================================
       نسخ الرابط
    ========================================= */

    async function copyMenuUrl() {

      if (!publicMenuUrl) {

        alert(
          "⚠️ رابط المنيو غير موجود."
        );

        return;

      }


      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(
            publicMenuUrl
          );

          alert(
            "✅ تم نسخ رابط المنيو"
          );

          return;

        }


        throw new Error(
          "Clipboard unavailable"
        );

      } catch (error) {

        prompt(
          "انسخ رابط المنيو:",
          publicMenuUrl
        );

      }

    }


    /* =========================================
       مشاركة
    ========================================= */

    async function shareMenu() {

      if (!publicMenuUrl) {

        alert(
          "⚠️ رابط المنيو غير موجود."
        );

        return;

      }


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              siteData.business_name ||
              "المنيو",

            text:
              "شوف المنيو الخاصة بنا",

            url:
              publicMenuUrl

          });

        } catch (error) {

          /*
            المستخدم ممكن يلغي المشاركة
          */

        }

      } else {

        await copyMenuUrl();

      }

    }


    /* =========================================
       نوع النشاط
    ========================================= */

    function getBusinessType(type) {

      const types = {

        restaurant:
          "مطعم",

        cafe:
          "كافيه",

        "restaurant-cafe":
          "مطعم وكافيه",

        bakery:
          "مخبوزات وحلويات",

        other:
          "نشاط تجاري"

      };

      return (
        types[type] ||
        "مطعم"
      );

    }


    /* =========================================
       تعديل الموقع
    ========================================= */

    function editSite() {

      /*
        مهم جداً:
        لا نمسح أي بيانات هنا.

        الـ slug والـ ID يفضلوا موجودين
        عشان نفس QR يفضل شغال.
      */

      window.location.href =
        "restaurant-setup.html";

    }


    /* =========================================
       رجوع
    ========================================= */

    function goBack() {

      window.location.href =
        "create-site.html";

    }


    /* =========================================
       اتصال
    ========================================= */

    function callBusiness() {

      if (
        !siteData ||
        !siteData.phone
      ) {
        return;
      }

      window.location.href =
        "tel:" +
        siteData.phone;

    }


    /* =========================================
       واتساب
    ========================================= */

    function openWhatsApp() {

      if (
        !siteData ||
        !siteData.whatsapp
      ) {
        return;
      }


      let number =
        String(
          siteData.whatsapp
        ).replace(
          /\D/g,
          ""
        );


      if (
        number.startsWith("0")
      ) {

        number =
          "20" +
          number.substring(1);

      }


      if (
        !number.startsWith("20")
      ) {

        number =
          "20" +
          number;

      }


      window.open(
        "https://wa.me/" +
        number,
        "_blank"
      );

    }


    /* =========================================
       لا يوجد موقع
    ========================================= */

    function showEmpty() {

      document.getElementById(
        "site"
      ).innerHTML = `

        <div class="empty">

          <h2>
            مفيش موقع محفوظ لسه
          </h2>

          <p>
            ابدأ بإنشاء موقع المطعم والمنيو.
          </p>

          <button
            onclick="editSite()"
          >
            🍽️ إنشاء الموقع
          </button>

        </div>

      `;

    }


    /* =========================================
       حماية HTML
    ========================================= */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* تشغيل الصفحة */

    loadSite();
