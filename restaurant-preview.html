  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let siteData = null;
    let publicMenuUrl = "";


    /* =========================
       PUBLIC URL
    ========================= */

    function buildPublicMenuUrl(slug) {

      if (!slug) return "";

      return (
        window.location.origin +
        "/menu.html?slug=" +
        encodeURIComponent(slug)
      );

    }


    /* =========================
       ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       GET SLUG
    ========================= */

    function getSavedSlug() {

      let slug =
        localStorage.getItem(
          "warsha_restaurant_menu_slug"
        ) || "";

      if (slug) return slug;


      const savedUrl =
        localStorage.getItem(
          "warsha_restaurant_menu_url"
        );


      if (savedUrl) {

        try {

          const url =
            new URL(savedUrl);

          slug =
            url.searchParams.get("slug") || "";

        } catch (error) {

          console.error(
            "URL ERROR:",
            error
          );

        }

      }


      if (!slug &&
          siteData &&
          siteData.public_slug) {

        slug =
          siteData.public_slug;

      }


      return slug;

    }


    /* =========================
       LOAD LOCAL DATA
    ========================= */

    function loadLocalData() {

      try {

        const raw =
          localStorage.getItem(
            "warsha_restaurant_site"
          );


        if (raw) {

          siteData =
            JSON.parse(raw);

        }

      } catch (error) {

        console.error(
          "LOCAL DATA ERROR:",
          error
        );

      }


      const slug =
        getSavedSlug();


      if (slug) {

        publicMenuUrl =
          buildPublicMenuUrl(slug);


        localStorage.setItem(
          "warsha_restaurant_menu_slug",
          slug
        );


        localStorage.setItem(
          "warsha_restaurant_menu_url",
          publicMenuUrl
        );

      }


      return !!siteData;

    }


    /* =========================
       LOAD DATABASE
    ========================= */

    async function refreshFromDatabase() {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) return;


        const savedId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          );


        const savedSlug =
          localStorage.getItem(
            "warsha_restaurant_menu_slug"
          );


        let menu = null;


        /* البحث بالـID */

        if (savedId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug"
              )
              .eq(
                "id",
                savedId
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (
            !result.error &&
            result.data
          ) {

            menu =
              result.data;

          }

        }


        /* البحث بالـslug */

        if (!menu && savedSlug) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug"
              )
              .eq(
                "public_slug",
                savedSlug
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (
            !result.error &&
            result.data
          ) {

            menu =
              result.data;

          }

        }


        if (!menu) return;


        /* حفظ ID */

        localStorage.setItem(
          "warsha_restaurant_menu_id",
          String(menu.id)
        );


        /* حفظ slug */

        if (menu.public_slug) {

          publicMenuUrl =
            buildPublicMenuUrl(
              menu.public_slug
            );


          localStorage.setItem(
            "warsha_restaurant_menu_slug",
            menu.public_slug
          );


          localStorage.setItem(
            "warsha_restaurant_menu_url",
            publicMenuUrl
          );

        }


        /* تحديث بيانات الموقع */

        if (
          menu.menu_data &&
          typeof menu.menu_data === "object"
        ) {

          siteData =
            menu.menu_data;


          siteData.public_slug =
            menu.public_slug ||
            siteData.public_slug ||
            "";


          siteData.public_menu_url =
            publicMenuUrl;


          localStorage.setItem(
            "warsha_restaurant_site",
            JSON.stringify(siteData)
          );

        }

      } catch (error) {

        console.error(
          "DATABASE ERROR:",
          error
        );

      }

    }


    /* =========================
       CREATE QR IMAGE URL
    ========================= */

    function getQRImageUrl(url) {

      if (!url) return "";

      return (
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=500x500" +
        "&margin=15" +
        "&data=" +
        encodeURIComponent(url)
      );

    }


    /* =========================
       RENDER
    ========================= */

    function renderSite() {

      const container =
        document.getElementById(
          "siteContainer"
        );


      if (!siteData) {

        container.innerHTML = `
          <div class="error">
            لم يتم العثور على بيانات الموقع.
            <br><br>
            ارجع إلى صفحة الإعداد وأنشئ الموقع مرة أخرى.
          </div>
        `;

        return;

      }


      const categories =
        siteData.categories || [];


      const phone =
        siteData.phone || "";


      const phoneHref =
        phone
          ? "tel:" +
            phone.replace(/\s/g, "")
          : "#";


      let categoriesHtml = "";

        const items =
          category.items || [];


        let itemsHtml = "";

          itemsHtml += `
            <div class="item">

              <div class="item-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="item-price">
                ${escapeHtml(item.price)}
                جنيه
              </div>

            </div>
          `;

        });


        categoriesHtml += `
          <section class="category">

            <h4 class="category-title">
              ${escapeHtml(category.name)}
            </h4>

            ${itemsHtml}

          </section>
        `;

      });


      /* =========================
         QR SECTION
      ========================= */

      let qrSection = "";

        const qrImageUrl =

                </a>


                <a
                  class="btn download-btn"
                  href="${escapeHtml(qrImageUrl)}"
                  target="_blank"

                >

              </div>

              </div>

        `;

      } else {

            </div>

          </section>

        `;

      }


      /* =========================
         SITE HTML
      ========================= */

      container.innerHTML = `

        <div class="site">

          <section class="hero">

            <h2>
              ${escapeHtml(
                siteData.businessName ||
                "اسم المطعم"
              )}
            </h2>

            <p>
              ${escapeHtml(
                siteData.description ||
                ""
              )}
            </p>

            ${
              phone
              ? `
                <a
                  class="hero-phone"
                  href="${escapeHtml(phoneHref)}"
                >
                  📞 ${escapeHtml(phone)}
                </a>
              `
              : ""
            }

          </section>


          <div class="info-row">

            <div class="info-pill">
              🍽️ ${escapeHtml(
                siteData.businessType || ""
              )}
            </div>


            ${
              siteData.workingHours
              ? `
                <div class="info-pill">
                  🕐 ${escapeHtml(
                    siteData.workingHours
                  )}
                </div>
              `
              : ""
            }

          </div>


          <section class="menu-area">

            <div class="menu-title">

              <h3>
                🍽️ المنيو
              </h3>

            </div>

            ${categoriesHtml}

          </section>


          <section class="contact">

            <h3>
              📍 تواصل معنا
            </h3>


            <div class="contact-grid">

              ${
                phone
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      📞
                    </div>

                    <strong>
                      الهاتف
                    </strong>

                    <a href="${escapeHtml(phoneHref)}">
                      ${escapeHtml(phone)}
                    </a>

                  </div>
                `
                : ""
              }


              ${
                siteData.address
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      📍
                    </div>

                    <strong>
                      العنوان
                    </strong>

                    <div>
                      ${escapeHtml(
                        siteData.address
                      )}
                    </div>

                  </div>
                `
                : ""
              }


              ${
                siteData.workingHours
                ? `
                  <div class="contact-card">

                    <div class="contact-icon">
                      🕐
                    </div>

                    <strong>
                      مواعيد العمل
                    </strong>

                        siteData.workingHours

    /* =========================
       QR ERROR
    ========================= */

    function qrError() {

      const box =
        document.querySelector(
          ".qr-box"
        );


      if (!box) return;


      box.innerHTML = `

        <div style="
          text-align:center;
          color:#b91c1c;
          font-weight:700;
          font-size:14px;
          line-height:1.8;
        ">

          ⚠️ تعذر تحميل صورة الباركود

          <br>

          استخدم رابط المنيو الموجود بالأسفل.

        </div>

      `;

    }


    /* =========================
       COPY URL
    ========================= */

    async function copyPublicUrl() {

      if (!publicMenuUrl) return;


      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.writeText
        ) {

          await navigator.clipboard.writeText(
            publicMenuUrl
          );
