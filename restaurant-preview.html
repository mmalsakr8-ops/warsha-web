  <script>

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let siteData = null;
    let publicMenuUrl = "";
    let currentSlug = "";
    let currentMenuId = "";


    /* =========================
       URL
    ========================= */

    function buildPublicMenuUrl(slug) {

      if (!slug) return "";

      return (
        window.location.origin +
        "/menu.html?slug=" +
        encodeURIComponent(slug)
      );

    }


    /* =========================
       SLUG
    ========================= */

    function createSlug(name) {

      const base =
        String(name || "menu")
          .trim()
          .toLowerCase()
          .replace(/[^\u0600-\u06FFa-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 40);

      const random =
        Math.random()
          .toString(36)
          .substring(2, 8);

      return (
        (base || "menu") +
        "-" +
        random
      );

    }


    function saveSlug(slug) {

      if (!slug) return;

      currentSlug =
        String(slug);

      publicMenuUrl =
        buildPublicMenuUrl(
          currentSlug
        );

      localStorage.setItem(
        "warsha_restaurant_menu_slug",
        currentSlug
      );

      localStorage.setItem(
        "warsha_restaurant_menu_url",
        publicMenuUrl
      );

    }


    function getLocalSlug() {

      const savedSlug =
        localStorage.getItem(
          "warsha_restaurant_menu_slug"
        ) || "";

      if (savedSlug) {
        return savedSlug;
      }


      const savedUrl =
        localStorage.getItem(
          "warsha_restaurant_menu_url"
        ) || "";


      if (!savedUrl) {
        return "";
      }


      try {

        const url =
          new URL(
            savedUrl,
            window.location.origin
          );

        return (
          url.searchParams.get("slug") ||
          ""
        );

      } catch (error) {

        return "";

      }

    }


    /* =========================
       ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       LOCAL DATA
    ========================= */

    function loadLocalData() {

      try {

        const raw =
          localStorage.getItem(
            "warsha_restaurant_site"
          );

        if (raw) {

          siteData =
            JSON.parse(raw);

        }

      } catch (error) {

        console.error(
          "LOCAL DATA ERROR:",
          error
        );

      }


      const localSlug =
        getLocalSlug();


      if (localSlug) {

        saveSlug(localSlug);

      } else if (
        siteData &&
        siteData.public_slug
      ) {

        saveSlug(
          siteData.public_slug
        );

      }


      return !!siteData;

    }


    /* =========================
       SAVE SLUG TO DATABASE
       ========================= */

    async function saveSlugToDatabase(
      menuId,
      slug,
      menuData
    ) {

      if (!menuId || !slug) {
        return false;
      }


      try {

        const newMenuData = {
          ...(menuData || {}),
          public_slug: slug,
          public_menu_url:
            buildPublicMenuUrl(slug)
        };


        const result =
          await supabaseClient
            .from("restaurant_menus")
            .update({
              public_slug: slug,
              menu_data: newMenuData,
              updated_at:
                new Date().toISOString()
            })
            .eq(
              "id",
              menuId
            );


        if (result.error) {

          console.error(
            "SAVE SLUG DATABASE ERROR:",
            result.error
          );

          return false;

        }


        return true;

      } catch (error) {

        console.error(
          "SAVE SLUG EXCEPTION:",
          error
        );

        return false;

      }

    }


    /* =========================
       DATABASE
    ========================= */

    async function refreshFromDatabase() {

      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          console.warn(
            "No authenticated user."
          );

          return;

        }


        const savedId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          ) || "";


        let savedSlug =
          currentSlug ||
          getLocalSlug();


        let menu = null;


        /* 1 — ID */

        if (savedId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug, updated_at"
              )
              .eq(
                "id",
                savedId
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (
            !result.error &&
            result.data
          ) {

            menu =
              result.data;

          }

        }


        /* 2 — SLUG */

        if (
          !menu &&
          savedSlug
        ) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug, updated_at"
              )
              .eq(
                "public_slug",
                savedSlug
              )
              .eq(
                "user_id",
                user.id
              )
              .maybeSingle();


          if (
            !result.error &&
            result.data
          ) {

            menu =
              result.data;

          }

        }


        /* 3 — آخر منيو للمستخدم */

        if (!menu) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, menu_name, business_type, menu_data, public_slug, updated_at"
              )
              .eq(
                "user_id",
                user.id
              )
              .order(
                "updated_at",
                {
                  ascending: false
                }
              )
              .limit(1)
              .maybeSingle();


          if (
            !result.error &&
            result.data
          ) {

            menu =
              result.data;

          }

        }


        if (!menu) {

          console.warn(
            "No restaurant menu found."
          );

          return;

        }


        currentMenuId =
          String(menu.id);


        localStorage.setItem(
          "warsha_restaurant_menu_id",
          currentMenuId
        );


        /* =========================
           استخراج الـSLUG
        ========================= */

        let dbSlug =
          menu.public_slug ||
          "";


        if (
          !dbSlug &&
          menu.menu_data &&
          menu.menu_data.public_slug
        ) {

          dbSlug =
            menu.menu_data.public_slug;

        }


        /*
         لو مفيش slug نهائيًا:
         ننشئ واحد مرة واحدة
        */

        if (!dbSlug) {

          dbSlug =
            createSlug(
              menu.menu_name ||
              (
                menu.menu_data &&
                menu.menu_data.businessName
              ) ||
              "menu"
            );


          const saved =
            await saveSlugToDatabase(
              menu.id,
              dbSlug,
              menu.menu_data
            );


          if (!saved) {

            console.warn(
              "Slug generated locally but could not be saved to database."
            );

          }

        }


        saveSlug(
          dbSlug
        );


        /* =========================
           تحديث البيانات
        ========================= */

        if (
          menu.menu_data &&
          typeof menu.menu_data === "object"
        ) {

          siteData = {
            ...menu.menu_data,
            public_slug:
              dbSlug,
            public_menu_url:
              buildPublicMenuUrl(
                dbSlug
              )
          };


          localStorage.setItem(
            "warsha_restaurant_site",
            JSON.stringify(siteData)
          );

        }

      } catch (error) {

        console.error(
          "DATABASE ERROR:",
          error
        );

      }

    }


    /* =========================
       QR
    ========================= */

    function getQRImageUrl(url) {

      if (!url) return "";

      return (
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=500x500" +
        "&margin=15" +
        "&data=" +
        encodeURIComponent(url)
      );

    }


    /* =========================
       RENDER
    ========================= */

    function renderSite() {

      const container =
        document.getElementById(
          "siteContainer"
        );


      if (!siteData) {

        container.innerHTML = `
          <div class="error">
            لم يتم العثور على بيانات الموقع.
            <br><br>
            ارجع إلى صفحة الإعداد وأنشئ الموقع مرة أخرى.
          </div>
        `;

        return;

      }


      const slug =
        currentSlug ||
        getLocalSlug() ||
        siteData.public_slug ||
        "";


      if (slug) {

        saveSlug(slug);

      }


      const categories =
        siteData.categories || [];


      const phone =
        siteData.phone || "";


      const phoneHref =
        phone
          ? "tel:" +
            phone.replace(/\s/g, "")
          : "#";


      let categoriesHtml = "";


      categories.forEach(
        category => {

          const items =
            category.items || [];


          let itemsHtml = "";


          items.forEach(
            item => {

              itemsHtml += `
                <div class="item">

                  <div class="item-name">
                    ${escapeHtml(item.name)}
                  </div>

                  <div class="item-price">
                    ${escapeHtml(item.price)}
                    جنيه
                  </div>

                </div>
              `;

            }
          );


          categoriesHtml += `
            <section class="category">

              <h4 class="category-title">
                ${escapeHtml(category.name)}
              </h4>

              ${itemsHtml}

            </section>
          `;

        }
      );


      let qrSection = "";


      if (publicMenuUrl) {

        const qrImageUrl =
          getQRImageUrl(
            publicMenuUrl
          );


        qrSection = `

          <section class="qr-section">

            <h3>
              📱 باركود المنيو
            </h3>

            <p class="qr-description">
              امسح الباركود بالموبايل لفتح المنيو مباشرة
            </p>

            <div class="qr-box">

              <img
                id="qrImage"
                src="${escapeHtml(qrImageUrl)}"
                alt="باركود المنيو"
                onerror="qrError()"
              >

            </div>

            <div class="public-url-box">

              <div class="public-url-label">
                🔗 رابط المنيو العام
              </div>

              <a
                class="public-url"
                href="${escapeHtml(publicMenuUrl)}"
                target="_blank"
                rel="noopener"
              >
                ${escapeHtml(publicMenuUrl)}
              </a>

              <div class="qr-actions">

                <button
                  class="btn copy-btn"
                  onclick="copyPublicUrl()"
                >
                  📋 نسخ الرابط
                </button>

                <a
                  class="btn open-btn"
                  href="${escapeHtml(publicMenuUrl)}"
                  target="_blank"
                  rel="noopener"
                >
                  🔗 فتح المنيو
                </a>

                <a
                  class="btn download-btn"
                  href="${escapeHtml(qrImageUrl)}"
                  target="_blank"
                  rel="noopener"
                >
                  ⬇️ فتح الباركود
                </a>

              </div>

              <div class="stable-note">
                🔒 هذا الرابط والباركود ثابتان حتى بعد تعديل المنيو.
              </div>

            </div>

          </section>

        `;

      } else {

        qrSection = `

          <section class="qr-section">

            <h3>
              📱 باركود المنيو
            </h3>

            <p style="
              color:#b91c1c;
              font-weight:700;
            ">
              لم يتم إنشاء رابط المنيو حتى الآن.
            </p>

            <div style="
              margin-top:15px;
              color:#6b7280;
              line-height:1.9;
            ">
              جاري محاولة إنشاء الرابط تلقائيًا.
            </div>

          </section>

        `;

      }


      container.innerHTML = `

        <div class="site">

          <section class="hero">

            <h2>
              ${escapeHtml(
                siteData.businessName ||
                "اسم المطعم"
              )}
            </h2>

            <p>
              ${escapeHtml(
                siteData.description ||
                ""
              )}
            </p>

            ${
              phone
              ? `
                <a
                  class="hero-phone"
                  href="${escapeHtml(phoneHref)}"
                >
                  📞 ${escapeHtml(phone)}
                </a>
              `
              : ""

    function qrError() {

      const box =
        document.querySelector(
          ".qr-box"
        );


      if (!box) return;


      box.innerHTML = `

        <div class="qr-error">

          ⚠️ تعذر تحميل صورة الباركود حاليًا.

          <br>

          لكن رابط المنيو موجود بالأسفل ويمكن فتحه مباشرة.

        </div>

      `;

    }


    /* =========================
       COPY
    ========================= */

    async function copyPublicUrl() {

      if (!publicMenuUrl) return;


      try {

        await navigator.clipboard.writeText(
          publicMenuUrl
        );

        alert(
          "✅ تم نسخ رابط المنيو"
        );

      } catch (error) {

        const input =
          document.createElement(
            "input"
          );

        input.value =
          publicMenuUrl;

        document.body.appendChild(
          input
        );

        input.focus();
        input.select();

        document.execCommand(
          "copy"
        );

        input.remove();

        alert(
          "✅ تم نسخ رابط المنيو"
        );

      }

    }

      if (siteData) {

        renderSite();

      document
        .getElementById("loading")
        .style.display =
          siteData
          ? "none"
          : "block";


      await refreshFromDatabase();


      renderSite();


      document
        .getElementById("loading")
        .style.display =
          "none";

    init();
