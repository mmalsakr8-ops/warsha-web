<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>معاينة الموقع | ورشة ويب</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 12px 18px;
      text-align: center;
      font-size: 14px;
    }

    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 12px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .preview-title {
      font-weight: 800;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .back-btn {
      border: 0;
      background: #f3f4f6;
      color: #374151;
      padding: 9px 15px;
      border-radius: 9px;
      font-weight: 600;
    }

    .edit-btn {
      border: 0;
      background: #f97316;
      color: white;
      padding: 9px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .site {
      min-height: calc(100vh - 100px);
    }

    /* الهيدر */

    .hero {
      color: white;
      text-align: center;
      padding: 75px 20px;
    }

    .hero.modern {
      background: linear-gradient(135deg, #111827, #374151);
    }

    .hero.luxury {
      background: linear-gradient(135deg, #18181b, #3f3f46);
    }

    .hero.simple {
      background: #374151;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 42px;
      font-weight: 800;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      line-height: 2;
      color: #e5e7eb;
    }

    .hero-info {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-info span {
      background: rgba(255,255,255,.12);
      padding: 8px 15px;
      border-radius: 30px;
      font-size: 14px;
    }

    /* المحتوى */

    .content {
      width: min(950px, 92%);
      margin: 35px auto 60px;
    }

    /* قسم المنيو */

    .menu-category {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
      box-shadow: 0 7px 25px rgba(0,0,0,.05);
    }

    .category-title {
      margin: 0 0 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f97316;
      font-size: 24px;
      font-weight: 800;
    }

    /* الصنف */

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px 3px;
      border-bottom: 1px solid #eeeeee;
    }

    .menu-item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-size: 17px;
      font-weight: 700;
    }

    .item-price {
      color: #f97316;
      font-weight: 800;
      white-space: nowrap;
    }

    /* التواصل */

    .contact-section {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 7px 25px rgba(0,0,0,.05);
    }

    .contact-section h2 {
      margin-top: 0;
      font-size: 23px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .contact-box {
      background: #f9fafb;
      border-radius: 13px;
      padding: 18px;
      text-align: center;
    }

    .contact-icon {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .contact-box strong {
      display: block;
      margin-bottom: 5px;
    }

    .contact-box div {
      color: #6b7280;
      font-size: 14px;
      word-break: break-word;
    }

    /* أزرار التواصل */

    .actions {
      text-align: center;
      margin: 30px 0;
    }

    .call-btn,
    .whatsapp-btn {
      border: 0;
      color: white;
      padding: 13px 27px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 800;
      margin: 5px;
    }

    .call-btn {
      background: #111827;
    }

    .whatsapp-btn {
      background: #16a34a;
    }

    /* صندوق الرابط والـ QR */

    .public-menu-box {
      background: white;
      border-radius: 20px;
      padding: 28px 20px;
      margin-bottom: 25px;
      box-shadow: 0 7px 25px rgba(0,0,0,.06);
      text-align: center;
    }

    .public-menu-box h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
    }

    .public-menu-box .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .qr-wrapper {
      width: 220px;
      min-height: 220px;
      margin: 0 auto 22px;
      padding: 15px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 190px;
      height: auto;
    }

    .public-url {
      width: 100%;
      max-width: 650px;
      margin: 0 auto 15px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      direction: ltr;
      text-align: center;
      word-break: break-all;
      font-size: 14px;
      color: #374151;
    }

    .public-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .public-actions button {
      border: 0;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .open-menu-btn {
      background: #2563eb;
      color: white;
    }

    .copy-menu-btn {
      background: #111827;
      color: white;
    }

    .share-menu-btn {
      background: #16a34a;
      color: white;
    }

    .qr-note {
      margin: 18px 0 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.8;
    }

    /* لو مفيش بيانات */

    .empty {
      text-align: center;
      padding: 80px 20px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty button {
      background: #f97316;
      border: 0;
      color: white;
      padding: 13px 25px;
      border-radius: 10px;
      font-weight: 700;
    }

    footer {
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }

    footer strong {
      color: white;
    }

    @media (max-width: 700px) {

      .preview-bar {
        flex-direction: column;
      }

      .preview-actions {
        width: 100%;
      }

      .preview-actions button {
        flex: 1;
      }

      .hero {
        padding: 55px 18px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }

      .menu-category,
      .contact-section {
        padding: 19px;
      }

      .menu-item {
        padding: 15px 0;
      }

      .public-menu-box {
        padding: 24px 15px;
      }

      .public-actions {
        flex-direction: column;
      }

      .public-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    👀 معاينة موقع المطعم — ورشة ويب
  </div>

  <div class="preview-bar">

    <div class="preview-title">
      🛠️ معاينة موقعك
    </div>

    <div class="preview-actions">

      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← رجوع
      </button>

      <button
        class="edit-btn"
        onclick="editSite()"
      >
        ✏️ تعديل الموقع
      </button>

    </div>

  </div>

  <main id="site" class="site"></main>

  <footer>
    تم إنشاء الموقع بواسطة <strong>ورشة ويب</strong>
  </footer>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qupoxgclybgbetqxzzwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-K5wIbqUcdaJbXlyLZaa2g_Y-BlCDis";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let siteData = null;
    let publicMenuUrl = "";


    /* تحميل البيانات */

    async function loadSite() {

      const saved =
        localStorage.getItem(
          "warsha_restaurant_site"
        );

      if (!saved) {
        showEmpty();
        return;
      }

      try {

        siteData =
          JSON.parse(saved);

        await loadPublicMenu();

        renderSite();

      } catch (error) {

        console.error(error);

        showEmpty();

      }
    }


    /* تحميل رابط المنيو من Supabase */

    async function loadPublicMenu() {

      try {

        const savedMenuId =
          localStorage.getItem(
            "warsha_restaurant_menu_id"
          );

        const savedSlug =
          localStorage.getItem(
            "warsha_restaurant_menu_slug"
          );


        let data = null;
        let error = null;


        /* أولاً نحاول بالـ ID */

        if (savedMenuId) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, public_slug"
              )
              .eq("id", savedMenuId)
              .maybeSingle();

          data = result.data;
          error = result.error;

        }


        /* لو الـ ID مش موجود نستخدم الـ slug */

        if (
          !data &&
          savedSlug
        ) {

          const result =
            await supabaseClient
              .from("restaurant_menus")
              .select(
                "id, public_slug"
              )
              .eq(
                "public_slug",
                savedSlug
              )
              .maybeSingle();

          data = result.data;
          error = result.error;

        }


        if (error) {

          console.error(
            "Supabase menu error:",
            error
          );

          return;

        }


        if (data && data.public_slug) {

          publicMenuUrl =
            window.location.origin +
            "/menu.html?slug=" +
            encodeURIComponent(
              data.public_slug
            );


          localStorage.setItem(
            "warsha_restaurant_menu_url",
            publicMenuUrl
          );

          localStorage.setItem(
            "warsha_restaurant_menu_id",
            data.id
          );

          localStorage.setItem(
            "warsha_restaurant_menu_slug",
            data.public_slug
          );

        } else {

          const oldUrl =
            localStorage.getItem(
              "warsha_restaurant_menu_url"
            );

          if (oldUrl) {
            publicMenuUrl = oldUrl;
          }

        }

      } catch (error) {

        console.error(
          "Public menu loading error:",
          error
        );

      }

    }


    /* بناء الموقع */

    function renderSite() {

      const site =
        document.getElementById("site");

      const businessName =
        escapeHTML(
          siteData.business_name ||
          "مطعمي"
        );

      const description =
        escapeHTML(
          siteData.description ||
          "أهلاً بكم، نتمنى لكم تجربة رائعة."
        );

      const phone =
        escapeHTML(
          siteData.phone ||
          "غير مضاف"
        );

      const address =
        escapeHTML(
          siteData.address ||
          "غير مضاف"
        );

      const hours =
        escapeHTML(
          siteData.working_hours ||
          "غير مضافة"
        );

      const design =
        siteData.design ||
        "modern";


      let categoriesHTML = "";


      if (
        Array.isArray(siteData.categories) &&
        siteData.categories.length
      ) {

        siteData.categories.forEach(category => {

          const categoryName =
            escapeHTML(
              category.name ||
              "قسم المنيو"
            );

          let itemsHTML = "";


          if (
            Array.isArray(category.items)
          ) {

            category.items.forEach(item => {

              const itemName =
                escapeHTML(
                  item.name ||
                  "صنف"
                );

              const itemPrice =
                escapeHTML(
                  item.price ||
                  ""
                );


              itemsHTML += `

                <div class="menu-item">

                  <div class="item-name">
                    ${itemName}
                  </div>

                  <div class="item-price">
                    ${
                      itemPrice
                        ? itemPrice + " جنيه"
                        : ""
                    }
                  </div>

                </div>

              `;

            });

          }


          categoriesHTML += `

            <section class="menu-category">

              <h2 class="category-title">
                ${categoryName}
              </h2>

              ${
                itemsHTML ||
                `
                  <p>
                    لا توجد أصناف مضافة لهذا القسم.
                  </p>
                `
              }

            </section>

          `;

        });

      }


      site.innerHTML = `

        <section class="hero ${design}">

          <h1>
            ${businessName}
          </h1>

          <p>
            ${description}
          </p>

          <div class="hero-info">

            <span>
              🍽️ ${getBusinessType(
                siteData.business_type
              )}
            </span>

            <span>
              🕐 ${hours}
            </span>

          </div>

        </section>


        <div class="content">


          <!-- رابط المنيو والـ QR -->

          ${
            publicMenuUrl
              ? `

                <section class="public-menu-box">

                  <h2>
                    📱 منيو العملاء
                  </h2>

                  <div class="subtitle">
                    أي شخص يقدر يفتح الرابط أو يمسح الـ QR Code ويشوف المنيو
                  </div>


                  <div class="qr-wrapper">

                    <div id="qrcode"></div>

                  </div>


                  <div class="public-url">
                    ${escapeHTML(publicMenuUrl)}
                  </div>


                  <div class="public-actions">

                    <button
                      class="open-menu-btn"
                      onclick="openPublicMenu()"
                    >
                      🌐 فتح المنيو
                    </button>

                    <button
                      class="copy-menu-btn"
                      onclick="copyMenuUrl()"
                    >
                      📋 نسخ الرابط
                    </button>

                    <button
                      class="share-menu-btn"
                      onclick="shareMenu()"
                    >
                      📤 مشاركة
                    </button>

                  </div>


                  <p class="qr-note">
                    💡 تقدر تحفظ صورة الـ QR Code وتحطها على الترابيزة أو باب المحل أو الفاتورة.
                  </p>

                </section>

              `
              : ""
          }


          ${categoriesHTML}


          <section class="contact-section">

            <h2>
              📍 تواصل معنا
            </h2>

            <div class="contact-grid">


              <div class="contact-box">

                <div class="contact-icon">
                  📞
                </div>

                <strong>
                  الهاتف
                </strong>

                <div>
                  ${phone}
                </div>

              </div>


              <div class="contact-box">

                <div class="contact-icon">
                  📍
                </div>

                <strong>
                  العنوان
                </strong>

                <div>
                  ${address}
                </div>

              </div>


              <div class="contact-box">

                <div class="contact-icon">
                  🕐
                </div>

                <strong>
                  مواعيد العمل
                </strong>

                <div>
                  ${hours}
                </div>

              </div>


            </div>

          </section>


          <div class="actions">

            ${
              siteData.phone
                ? `
                  <button
                    class="call-btn"
                    onclick="callBusiness()"
                  >
                    📞 اتصل بنا
                  </button>
                `
                : ""
            }


            ${
              siteData.whatsapp
                ? `
                  <button
                    class="whatsapp-btn"
                    onclick="openWhatsApp()"
                  >
                    💬 تواصل واتساب
                  </button>
                `
                : ""
            }

          </div>


        </div>

      `;


      /* إنشاء QR بعد ظهور العنصر */

      if (publicMenuUrl) {

        setTimeout(
          createQRCode,
          100
        );

      }

    }


    /* إنشاء QR Code */

    function createQRCode() {

      const qrElement =
        document.getElementById(
          "qrcode"
        );

      if (
        !qrElement ||
        !publicMenuUrl
      ) {
        return;
      }


      qrElement.innerHTML = "";


      new QRCode(
        qrElement,
        {
          text: publicMenuUrl,
          width: 190,
          height: 190,
          correctLevel:
            QRCode.CorrectLevel.H
        }
      );

    }


    /* فتح المنيو العامة */

    function openPublicMenu() {

      if (!publicMenuUrl) {
        return;
      }

      window.open(
        publicMenuUrl,
        "_blank"
      );

    }


    /* نسخ الرابط */

    async function copyMenuUrl() {

      if (!publicMenuUrl) {
        return;
      }


      try {

        await navigator.clipboard.writeText(
          publicMenuUrl
        );

        alert(
          "✅ تم نسخ رابط المنيو"
        );

      } catch (error) {

        prompt(
          "انسخ رابط المنيو:",
          publicMenuUrl
        );

      }

    }


    /* مشاركة الرابط */

    async function shareMenu() {

      if (!publicMenuUrl) {
        return;
      }


      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title:
              siteData.business_name ||
              "المنيو",
            text:
              "شوف المنيو الخاصة بنا",
            url:
              publicMenuUrl
          });

        } catch (error) {

          /* المستخدم ممكن يكون قفل المشاركة */

        }

      } else {

        await copyMenuUrl();

      }

    }


    /* نوع النشاط */

    function getBusinessType(type) {

      const types = {

        restaurant:
          "مطعم",

        cafe:
          "كافيه",

        "restaurant-cafe":
          "مطعم وكافيه",

        bakery:
          "مخبوزات وحلويات",

        other:
          "نشاط تجاري"

      };

      return (
        types[type] ||
        "مطعم"
      );

    }


    /* تعديل الموقع */

    function editSite() {

      /*
        لا نحذف localStorage
        عشان الرابط والبيانات يفضلوا موجودين.
      */

      window.location.href =
        "restaurant-setup.html";

    }


    /* الرجوع */

    function goBack() {

      window.location.href =
        "create-site.html";

    }


    /* اتصال */

    function callBusiness() {

      if (
        !siteData ||
        !siteData.phone
      ) {
        return;
      }

      window.location.href =
        "tel:" +
        siteData.phone;

    }


    /* واتساب */

    function openWhatsApp() {

      if (
        !siteData ||
        !siteData.whatsapp
      ) {
        return;
      }


      let number =
        siteData.whatsapp
          .replace(/\D/g, "");


      if (
        number.startsWith("0")
      ) {

        number =
          "20" +
          number.substring(1);

      }


      if (
        !number.startsWith("20")
      ) {

        number =
          "20" +
          number;

      }


      window.open(
        "https://wa.me/" +
        number,
        "_blank"
      );

    }


    /* لا يوجد موقع */

    function showEmpty() {

      document.getElementById(
        "site"
      ).innerHTML = `

        <div class="empty">

          <h2>
            مفيش موقع محفوظ لسه
          </h2>

          <p>
            ابدأ بإنشاء موقع المطعم والمنيو.
          </p>

          <button
            onclick="editSite()"
          >
            🍽️ إنشاء الموقع
          </button>

        </div>

      `;

    }


    /* حماية البيانات */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    loadSite();

  </script>

</body>
</html>
